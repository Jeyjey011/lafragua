# Compila LA FRAGUA para iPhone SIN firmar — no necesita cuenta de Apple ni
# secretos. Sirve para validar que el codigo Swift compila de verdad, usando
# el Mac que GitHub presta gratis en repositorios publicos.
# La publicacion real (TestFlight / App Store) es el otro workflow: ios-publicar.
name: ios-compila
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-compila.yml']
  workflow_dispatch: {}
permissions: {}
jobs:
  compilar:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generar el proyecto de Xcode
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Compilar sin firma
        run: |
          cd ios
          xcodebuild build \
            -project LaFragua.xcodeproj \
            -scheme LaFragua \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Veredicto
        run: echo "El codigo de la app de iPhone COMPILA. Falta solo la cuenta de Apple para firmar y publicar."
